<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Central Gestión</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,500;0,600;0,700;1,800&family=Noto+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior grafito con filete rojo; contenido en tarjetas blancas sobre gris claro; modales sobre fondo hexagonal. Tema claro único, como las referencias. */
:root{
  --rojo:#c4211b; --rojo-osc:#931510; --rojo-tinte:#fbebe9; --rojo-borde:#e3a6a2; --rojo-foco:rgba(196,33,27,.32);
  --tinta:#1c1c1f; --grafito:#2a2a2e; --grafito-2:#1f1f22; --texto-2:#5b5c62; --texto-3:#7b7c83;
  --linea:#e3e3e6; --linea-2:#c9c9cf; --fondo:#f2f2f3; --superficie:#ffffff; --superficie-2:#f7f7f8; --chip:#f0f0f2;
  --aviso-fondo:#fcf4e7; --aviso-texto:#6b4a0e; --aviso-chip:#f8ead2;
  --ok-fondo:#e8f3ec; --ok-texto:#1e6a3b; --deshab-fondo:#e7e7ea; --deshab-texto:#8b8c92;
  --blanco:#ffffff; --sombra:0 18px 48px rgba(0,0,0,.35);
  --f-titulo:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --f-texto:'Noto Sans',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,'Courier New',monospace;
  --dur-relleno:300ms; --ease:cubic-bezier(.4,0,.2,1);
  --hex:none;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--fondo)}
body{margin:0;color:var(--tinta);font:14px/1.5 var(--f-texto);-webkit-font-smoothing:antialiased}
body.con-modal{overflow:hidden}
h1,h2,h3{font-family:var(--f-titulo);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:30px;line-height:1.15}
h1:focus{outline:none}
p{margin:0}
a{color:inherit}
code{font-family:var(--f-mono);font-size:.92em}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;flex:none}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.tenue{color:var(--texto-3)}
.der{text-align:right}

/* ---------- Botones con relleno direccional ---------- */
.btn{
  --relleno:var(--rojo-tinte);
  position:relative;isolation:isolate;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:40px;padding:0 16px;border:1px solid transparent;border-radius:3px;
  font:500 15px/1 var(--f-texto);white-space:nowrap;cursor:pointer;text-decoration:none;
  transition:border-color var(--dur-relleno) var(--ease),color var(--dur-relleno) var(--ease),box-shadow .12s,filter .12s;
  -webkit-tap-highlight-color:transparent;
}
.btn::before{
  content:"";position:absolute;inset:-1px;z-index:-1;background:var(--relleno);
  transform:scaleY(0);transform-origin:top center;
  transition:transform var(--dur-relleno) var(--ease);
}
.btn:hover::before,.btn:focus-visible::before{transform:scaleY(1)}
.btn:focus-visible{outline:3px solid var(--rojo-foco);outline-offset:2px}
.btn:active:not(:disabled){box-shadow:inset 0 2px 4px rgba(0,0,0,.22);filter:brightness(.94)}
.btn .ic{position:relative}
.btn-primario{background:var(--rojo);color:var(--blanco);--relleno:var(--rojo-osc)}
.btn-peligro{background:#a91c16;color:var(--blanco);--relleno:#7c110d}
.btn-secundario{background:var(--superficie);color:var(--tinta);border-color:var(--linea-2)}
.btn-secundario:hover,.btn-secundario:focus-visible{border-color:var(--rojo-borde)}
.btn-secundario:hover .ic,.btn-secundario:focus-visible .ic{color:var(--rojo)}
.btn-peligro-borde{background:var(--superficie);color:var(--rojo);border-color:var(--rojo-borde)}
.btn-oscuro{background:transparent;color:var(--blanco);border-color:rgba(255,255,255,.32);--relleno:var(--rojo)}
.btn-oscuro:hover,.btn-oscuro:focus-visible{border-color:var(--rojo)}
.btn-chico{height:32px;padding:0 12px;font-size:13px;gap:6px}
.btn-chico .ic{width:16px;height:16px}
.btn-bloque{width:100%}
.btn:disabled:not(.cargando){background:var(--deshab-fondo);color:var(--deshab-texto);border-color:var(--deshab-fondo);cursor:not-allowed}
.btn:disabled:not(.cargando)::before{display:none}
.btn.cargando{cursor:progress}
.btn.cargando::before{transform:scaleY(1)}
.giro{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:girar .7s linear infinite;flex:none}
@keyframes girar{to{transform:rotate(360deg)}}

.enlace{background:none;border:0;padding:0;font:inherit;color:var(--rojo);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border-radius:2px}
.enlace:hover{text-decoration:underline;text-underline-offset:3px}
.enlace:focus-visible{outline:3px solid var(--rojo-foco);outline-offset:2px}
.enlace-gris{color:var(--texto-2)}
.btn-icono{width:36px;height:36px;display:inline-grid;place-items:center;border:0;background:none;border-radius:3px;color:var(--texto-2);cursor:pointer}
.btn-icono:hover{background:var(--chip);color:var(--tinta)}
.btn-icono:focus-visible{outline:3px solid var(--rojo-foco)}

/* ---------- Estructura ---------- */
.contenedor{max-width:1440px;margin:0 auto;padding-left:max(clamp(16px,2.9vw,42px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.9vw,42px),env(safe-area-inset-right,0px))}
.barra{background:var(--grafito);border-bottom:3px solid var(--rojo);color:var(--blanco)}
.barra .contenedor{display:flex;align-items:center;gap:clamp(16px,4vw,64px);min-height:72px;flex-wrap:wrap}
.marca{display:inline-flex;text-decoration:none;border-radius:2px}
.marca:focus-visible{outline:3px solid var(--rojo-foco);outline-offset:4px}
.logo{display:inline-flex;align-items:center;gap:6px}
.logo-c{width:30px;height:32px}
.logo-txt{display:flex;flex-direction:column;line-height:1}
.logo-a{font:italic 800 21px/1 var(--f-titulo);letter-spacing:.02em;color:var(--blanco)}
.logo-b{font:600 9.5px/1 var(--f-texto);letter-spacing:.32em;color:#d8d8dc;margin-top:4px;padding-left:1px}
.nav{display:flex;gap:30px;align-self:stretch}
.nav a{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:#c9c9ce;font:600 16.5px/1 var(--f-titulo);letter-spacing:.01em;border-bottom:3px solid transparent;padding-top:3px;transition:color .2s,border-color .2s}
.nav a:hover{color:var(--blanco)}
.nav a[aria-current="page"]{color:var(--blanco);font-weight:700;border-bottom-color:var(--blanco)}
.nav a:focus-visible{outline:3px solid var(--rojo-foco);outline-offset:-3px}
.usuario{margin-left:auto;display:flex;align-items:center;gap:20px}
.usuario-datos{display:flex;flex-direction:column;line-height:1.35}
.usuario-datos strong{font-weight:500;font-size:13.5px}
.usuario-datos span{font-size:12.5px;color:#bdbdc3}
main{padding-block:26px 8px}
.migas{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--texto-2);margin-bottom:14px;flex-wrap:wrap}
.migas a{text-decoration:none}
.migas a:hover{text-decoration:underline}
.migas .ic{width:16px;height:16px}
.cabecera{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.cabecera-titulo{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bajada{color:var(--texto-2);margin-top:12px;font-size:14px}
.acciones{display:flex;gap:12px;flex-wrap:wrap}
.pie{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--texto-2);padding-block:16px 28px}
.pie .enlace{font-size:11.5px}

.tarjeta{background:var(--superficie);border:1px solid var(--linea);border-radius:4px}
.tarjeta + .tarjeta{margin-top:20px}
.tarjeta-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--linea);flex-wrap:wrap}
.tarjeta-cab h2{font-size:17px}
.tarjeta-cab .meta{font-size:12.5px;color:var(--texto-2)}
.tarjeta-cuerpo{padding:22px 24px}
.tarjeta-pie{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;border-top:1px solid var(--linea);flex-wrap:wrap}
.separador{border:0;border-top:1px solid var(--linea);margin:24px 0}
.titulo-sec{font-size:17px}
.titulo-sec small{font:600 11.5px var(--f-titulo);color:var(--texto-2);letter-spacing:.02em}

/* ---------- Formularios ---------- */
.campo{display:flex;flex-direction:column;gap:8px;min-width:0}
.campo label,.etiqueta{font-size:13px;color:var(--tinta)}
.req{color:var(--rojo)}
.entrada,select.entrada,textarea.entrada{
  width:100%;height:42px;border:1px solid var(--linea-2);border-radius:3px;background:var(--superficie);
  font:13.5px var(--f-texto);color:var(--tinta);padding:0 12px;transition:border-color .15s,box-shadow .15s;
}
textarea.entrada{height:auto;min-height:94px;padding:10px 12px;resize:vertical}
.entrada::placeholder{color:#8a8b91}
.entrada:hover{border-color:#a9aab1}
.entrada:focus{outline:none;border-color:var(--grafito);box-shadow:0 0 0 3px var(--rojo-foco)}
.entrada[readonly],.entrada:disabled{background:#efeff1;color:var(--texto-2);border-color:var(--linea-2);cursor:not-allowed}
.entrada[aria-invalid="true"]{border-color:var(--rojo);box-shadow:0 0 0 1px var(--rojo) inset}
.entrada-num{text-align:right;font-variant-numeric:tabular-nums}
.con-icono{position:relative}
.con-icono .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--texto-2);pointer-events:none}
.con-icono .entrada{padding-left:40px}
.ayuda{font-size:11.5px;color:var(--texto-2)}
.error-campo{font-size:12px;color:var(--rojo);display:flex;gap:6px;align-items:flex-start}
.error-campo[hidden]{display:none}
.casilla{display:inline-flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;white-space:nowrap}
.casilla input{width:18px;height:18px;margin:0;accent-color:var(--rojo);cursor:pointer}
.grilla-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grilla-3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:18px}
.grilla-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.fila-cod{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:12px;align-items:start}
.fila-cod + .fila-cod{margin-top:14px}
.fila-cod .quitar{height:42px;padding:0 14px;font-size:15px}
.contador{font-variant-numeric:tabular-nums}

.aviso{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:3px;font-size:13px;line-height:1.55}
.aviso .ic{margin-top:1px}
.aviso-info{background:#f0f0f2;color:var(--tinta)}
.aviso-info .ic{color:var(--texto-2)}
.aviso-alerta{background:var(--aviso-fondo);color:var(--aviso-texto)}
.aviso-error{background:var(--rojo-tinte);color:#7d1410}
.aviso-ok{background:var(--ok-fondo);color:var(--tinta)}
.aviso-ok .ic{color:var(--ok-texto)}

/* ---------- Tablas ---------- */
.tabla-caja{overflow-x:auto;position:relative}
.tabla{width:100%;border-collapse:collapse;font-size:13.5px}
.tabla th{font-weight:400;font-size:12.5px;color:var(--texto-2);background:var(--superficie-2);text-align:left;padding:12px 20px;border-bottom:1px solid var(--linea);white-space:nowrap}
.tabla td{padding:14px 20px;border-bottom:1px solid var(--linea);vertical-align:middle}
.tabla tbody tr:last-child td{border-bottom:0}
.tabla .der{text-align:right}
.tabla-art tbody tr{cursor:pointer;transition:background .15s}
.tabla-art tbody tr:hover{background:#fafafa}
.tabla-art td{padding-block:15px}
.fila-inactiva td{color:var(--texto-2)}
.th-orden{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;border-radius:2px}
.th-orden:hover{color:var(--tinta)}
.th-orden .ic{width:14px;height:14px;opacity:.55}
.th-orden[data-activo] .ic{opacity:1;color:var(--rojo)}
.th-orden:focus-visible{outline:3px solid var(--rojo-foco);outline-offset:2px}
.chip-cod{display:inline-block;font:500 11.5px/1 var(--f-mono);background:var(--chip);border:1px solid var(--linea);padding:5px 7px;border-radius:2px;color:var(--tinta);white-space:nowrap;letter-spacing:.03em}
.estado{display:inline-block;font-size:11px;padding:3px 8px;border-radius:2px;font-weight:500;vertical-align:middle}
.estado-activo{background:#eef6f0;color:var(--ok-texto)}
.estado-inactivo{background:#ececef;color:var(--texto-2)}
.chip-aviso{display:inline-block;background:var(--aviso-chip);color:var(--aviso-texto);font-size:12px;padding:3px 8px;border-radius:2px;white-space:nowrap}
.paginacion{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--texto-2)}

/* ---------- Búsqueda de artículos ---------- */
.busqueda{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;column-gap:16px;row-gap:8px;align-items:center;padding:22px 22px 20px}
.busqueda > label{grid-column:1/-1;font-size:13px}
.busqueda .ayuda{grid-column:1/-1;margin-top:2px}
.busqueda .entrada{height:42px}
.busqueda .btn{height:40px}
.vacio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:72px 20px 80px;color:var(--texto-2)}
.vacio .ic{width:28px;height:28px;color:var(--texto-2);margin-bottom:4px}
.vacio h2{font-size:19px;color:var(--tinta)}
.vacio p{font-size:14.5px;line-height:1.6}
.vacio .btn{margin-top:10px}

/* ---------- Ficha ---------- */
.resumen{display:flex;gap:clamp(24px,4.5vw,64px);flex-wrap:wrap;padding:18px 24px;background:var(--superficie);border-block:1px solid var(--linea);margin-bottom:22px}
.resumen dt{font-size:13px;color:var(--texto-2)}
.resumen dd{margin:6px 0 0;font-size:21px;font-variant-numeric:tabular-nums}
.resumen dd small{font-size:12px;color:var(--texto-2)}
.resumen dd.txt{font-size:14.5px;font-weight:600}
.ficha-grilla{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.ficha-col{display:flex;flex-direction:column;gap:20px;min-width:0}
.ficha-col .tarjeta + .tarjeta{margin-top:0}
.tarjeta-cab.grande{padding:20px 22px}
.tarjeta-cab.grande h2{font-size:19px}
.codigos-lista{list-style:none;margin:0;padding:6px 22px 16px}
.codigos-lista li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--linea)}
.codigos-lista li:last-child{border-bottom:0}
.codigos-lista .prov{font-size:12.5px;color:var(--texto-2);margin-top:6px}
.pie-ficha{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap;font-size:12.5px;color:var(--texto-2)}
.banda-aviso{margin-bottom:20px}

/* ---------- Editar ---------- */
.edicion{max-width:1020px}
.edicion .tarjeta-cuerpo{padding:24px 24px 24px}
.edicion .tarjeta-pie{justify-content:flex-end;background:var(--superficie-2);padding:18px 26px}
.vigentes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--texto-2);margin-top:12px}

/* ---------- Compra ---------- */
.prov-lista{border:1px solid var(--linea);border-radius:3px;margin-top:10px}
.prov-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px}
.prov-item + .prov-item{border-top:1px solid var(--linea)}
.prov-item .nom{font-size:14px}
.prov-item .det{font-size:12px;color:var(--texto-2);margin-top:4px}
.prov-elegido{display:flex;align-items:center;gap:14px;background:var(--superficie-2);border:1px solid var(--linea);border-radius:3px;padding:16px 18px}
.prov-elegido .avatar{width:38px;height:38px;border-radius:3px;background:#ebebee;display:grid;place-items:center;color:var(--texto-2)}
.prov-elegido .enlace{margin-left:auto;font-size:15px;padding:4px 8px}
.fila-buscar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.tabla-lineas td{padding:12px 14px;vertical-align:top}
.tabla-lineas th{padding:12px 14px}
.tabla-lineas td:first-child,.tabla-lineas th:first-child{padding-left:14px}
.tabla-lineas .entrada{height:38px}
.tabla-lineas .w-dest{width:150px}
.tabla-lineas .w-cant{width:86px}
.tabla-lineas .w-prec{width:136px}
.tabla-lineas .w-desc{width:78px}
.tabla-lineas .error-campo{margin-top:6px;max-width:170px}
.celda-art{min-width:220px;padding-top:16px!important}
.celda-art .mono{display:block;margin-bottom:6px}
.agregar-art{padding:18px 22px 22px;border-top:1px solid var(--linea)}
.res-art{border:1px solid var(--linea);border-radius:3px;margin-top:10px}
.res-art li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px}
.res-art li + li{border-top:1px solid var(--linea)}
.res-art ul{list-style:none;margin:0;padding:0}
.importe-linea{font-size:12px;color:var(--texto-2);margin-top:6px;text-align:right}
.pie-accion{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap;font-size:12.5px;color:var(--texto-2)}
.pie-accion .btn{height:40px}
.ok-circulo{width:48px;height:48px;border-radius:50%;background:var(--ok-fondo);display:grid;place-items:center;color:var(--ok-texto);margin-bottom:24px}
.ok-circulo .ic{width:22px;height:22px}

/* ---------- Acceso ---------- */
.fondo-hex{background-color:#2b2b2e;background-image:var(--hex);background-size:cover;background-position:center}
.acceso{min-height:100vh;display:grid;place-items:center;padding:clamp(16px,6vw,140px) max(16px,env(safe-area-inset-right,0px)) clamp(16px,6vw,140px) max(16px,env(safe-area-inset-left,0px))}
.acceso-tarjeta{width:min(1080px,100%);display:grid;grid-template-columns:1fr 1fr;border-radius:4px;overflow:hidden;box-shadow:var(--sombra);animation:aparecer .35s var(--ease)}
.acceso-form{background:var(--superficie);padding:clamp(28px,10vw,148px) clamp(24px,5.2vw,75px) 56px}
.acceso-form .eyebrow{font-size:13px;color:var(--texto-2)}
.acceso-form h1{font-size:36px;margin:18px 0 14px}
.acceso-form .bajada{margin:0 0 30px}
.acceso-form form{display:flex;flex-direction:column;gap:20px}
.acceso-form .btn{height:44px;margin-top:8px}
.acceso-form hr{border:0;border-top:1px solid var(--linea);margin:28px 0 20px}
.acceso-form .minimo{font-size:11.5px;color:var(--texto-2)}
.acceso-form .demo{margin-top:8px;line-height:1.7}
.acceso-marca{position:relative;background:#18181a;color:var(--blanco);padding:56px 48px 52px;display:flex;flex-direction:column;border-bottom:4px solid var(--rojo)}
.acceso-marca::before{content:"";position:absolute;inset:0;background-image:var(--hex);background-size:cover;opacity:.12;pointer-events:none}
.acceso-marca > *{position:relative}
.acceso-marca .logo-c{width:42px;height:46px}
.acceso-marca .logo-a{font-size:28px}
.acceso-marca .logo-b{font-size:11.5px;margin-top:6px}
.acceso-marca .raya{width:58px;height:3px;background:var(--rojo);margin:auto 0 26px}
.acceso-marca h2{font-size:clamp(34px,4.3vw,52px);line-height:1.12;font-weight:700}
.acceso-marca p{margin-top:26px;font-size:15px;line-height:1.7;color:#e6e6e9}
.acceso-marca .firma{margin-top:auto;padding-top:40px;font-size:12px;color:#d6d6da}

/* ---------- Modales ---------- */
.modal-raiz{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.modal-fondo{position:absolute;inset:0;opacity:0;transition:opacity .2s var(--ease)}
.modal-fondo::after{content:"";position:absolute;inset:0;background:rgba(14,14,16,.12)}
.modal{position:relative;width:min(var(--ancho,560px),100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--superficie);border-radius:5px;box-shadow:var(--sombra);opacity:0;transform:translateY(10px) scale(.985);transition:opacity .2s var(--ease),transform .22s var(--ease)}
.modal-raiz.abierto .modal-fondo{opacity:1}
.modal-raiz.abierto .modal{opacity:1;transform:none}
.modal-raiz.cerrando .modal{transition-duration:.14s;transform:translateY(6px) scale(.99)}
.modal-raiz.cerrando .modal-fondo{transition-duration:.14s}
.modal-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 26px 20px;border-bottom:1px solid var(--linea)}
.modal-cab h2{font-size:24px}
.modal-cab p{font-size:13px;color:var(--texto-2);margin-top:10px}
.modal-cuerpo{padding:24px 26px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.modal-pie{display:flex;justify-content:flex-end;gap:10px;padding:18px 26px;border-top:1px solid var(--linea);background:var(--superficie-2);border-radius:0 0 5px 5px}

/* ---------- Avisos flotantes ---------- */

.toast.ok{border-left-color:#3fa66a}
.toast .ic{color:#9fd8b4}
.toast.error .ic{color:#ff9d97}
.toast .enlace{color:#ffb3ad;font-weight:600}
.toast.saliendo{opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* =========================================================

function fondoHex() {
  try {
    const W = 1600, H = 1100, c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#141416'); bg.addColorStop(1, '#3b3b3f');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    const R = 132, w = Math.sqrt(3) * R, hueco = 9;
    const camino = (cx, cy, r) => { g.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 180 * (60 * i - 90); g.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); } g.closePath(); };
    for (let fila = -1; fila * R * 1.5 < H + R; fila++) {
      for (let col = -1; col * w < W + w; col++) {
        const cx = col * w + (Math.abs(fila) % 2 ? w / 2 : 0), cy = fila * R * 1.5, r = R - hueco / 2;
        const t = Math.max(0, Math.min(1, cy / H)), luz = (cx / W) * .25;
        camino(cx + 6, cy + 10, r); g.fillStyle = 'rgba(0,0,0,.6)'; g.fill();
        camino(cx, cy, r);
        const base = 30 + t * 46 + luz * 20;
        const lg = g.createLinearGradient(cx - r, cy - r, cx + r * .6, cy + r);
        lg.addColorStop(0, `rgb(${base + 22},${base + 22},${base + 25})`);
        lg.addColorStop(1, `rgb(${base - 8},${base - 8},${base - 6})`);
        g.fillStyle = lg; g.fill();
        g.save(); camino(cx, cy, r); g.clip();
        g.lineWidth = 5; g.strokeStyle = `rgba(255,255,255,${.07 + t * .1})`; camino(cx - 2, cy - 3, r); g.stroke();
        g.restore();
        camino(cx, cy, r - 16);
        const ig = g.createLinearGradient(cx, cy - r, cx, cy + r);
        ig.addColorStop(0, `rgba(255,255,255,${.02 + t * .05})`); ig.addColorStop(1, 'rgba(0,0,0,.14)');
        g.fillStyle = ig; g.fill();
      }

    const v = g.createRadialGradient(W * .5, H * .5, H * .25, W * .5, H * .5, H);

function aviso(texto, { tipo = 'ok', accion, alAccion, ms = 3800 } = {}) {
  const t = document.createElement('div');
  t.className = `toast ${tipo}`;
  t.innerHTML = `${I(tipo === 'error' ? 'alerta' : 'check')}<span>${esc(texto)}</span>${accion ? `<button type="button" class="enlace">${esc(accion)}</button>` : ''}`;
  $('#avisos').appendChild(t);
  const cerrar = () => { t.classList.add('saliendo'); setTimeout(() => t.remove(), 220); };
  if (accion) t.querySelector('button').addEventListener('click', () => { alAccion && alAccion(); cerrar(); });
  setTimeout(cerrar, ms);
}

const pila = [];
let nModal = 0;
function abrirModal({ titulo, subtitulo = '', cuerpo, pie = '', ancho = 560, alMontar, antesDeCerrar, foco }) {
  const previo = document.activeElement;
  const n = ++nModal;
  const raiz = document.createElement('div');
  raiz.className = 'modal-raiz';
  raiz.innerHTML = `<div class="modal-fondo fondo-hex" data-fondo></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt-${n}" style="--ancho:${ancho}px">
      <header class="modal-cab"><div><h2 id="mt-${n}">${titulo}</h2>${subtitulo ? `<p>${subtitulo}</p>` : ''}</div>
        <button type="button" class="btn-icono" data-cerrar aria-label="Cerrar">${I('cruz')}</button></header>
      <div class="modal-cuerpo">${cuerpo}</div>
      ${pie ? `<footer class="modal-pie">${pie}</footer>` : ''}
    </div>`;
  document.body.appendChild(raiz);
  document.body.classList.add('con-modal');
  requestAnimationFrame(() => requestAnimationFrame(() => raiz.classList.add('abierto')));
  const ctl = {
    raiz,
    cerrar(forzar) {
      if (!forzar && antesDeCerrar && antesDeCerrar(ctl) === false) return;
      const i = pila.indexOf(ctl); if (i < 0) return;
      pila.splice(i, 1);
      raiz.classList.remove('abierto'); raiz.classList.add('cerrando');
      setTimeout(() => raiz.remove(), 160);
      if (!pila.length) document.body.classList.remove('con-modal');
      if (previo && previo.isConnected) previo.focus({ preventScroll: true });
    }
  };
  raiz.addEventListener('click', e => { if (e.target.closest('[data-cerrar]')) { e.preventDefault(); ctl.cerrar(); } });
  raiz.querySelector('[data-fondo]').addEventListener('click', () => ctl.cerrar());
  pila.push(ctl);
  alMontar && alMontar(ctl);
  setTimeout(() => {
    const el = (foco && raiz.querySelector(foco)) || raiz.querySelector('input:not([readonly]):not([disabled]),textarea,select') || raiz.querySelector('.modal-pie .btn');
    el && el.focus();
  }, 40);
  return ctl;
}
document.addEventListener('keydown', e => {
  const tope = pila[pila.length - 1];
  if (!tope) return;
  if (e.key === 'Escape') { e.preventDefault(); tope.cerrar(); return; }
  if (e.key === 'Tab') {
    const f = $$('button:not([disabled]),input:not([disabled]),textarea,select,a[href],[tabindex]:not([tabindex="-1"])', tope.raiz.querySelector('.modal'));
    if (!f.length) return;
    const pri = f[0], ult = f[f.length - 1];
    if (e.shiftKey && document.activeElement === pri) { e.preventDefault(); ult.focus(); }
    else if (!e.shiftKey && document.activeElement === ult) { e.preventDefault(); pri.focus(); }
  }
});

function confirmar({ titulo, subtitulo = '', mensaje, textoOk = 'Confirmar', peligro = false, icono = '', onOk, ms = 0 }) {
  const ctl = abrirModal({
    titulo, subtitulo, ancho: 520, foco: '[data-cerrar].btn',
    cuerpo: `<div class="aviso aviso-alerta">${I('alerta')}<p>${mensaje}</p></div>`,
    pie: `<button type="button" class="btn btn-secundario" data-cerrar>Cancelar</button><button type="button" class="btn ${peligro ? 'btn-peligro' : 'btn-primario'}" data-ok>${icono ? I(icono) : ''}<span>${textoOk}</span></button>`
  });
  ctl.raiz.querySelector('[data-ok]').addEventListener('click', e => {
    if (ms) conCarga(e.currentTarget, 'Procesando…', ms, () => { ctl.cerrar(true); onOk && onOk(); });
    else { ctl.cerrar(true); onOk && onOk(); }
  });
  return ctl;
}

/* Estado de carga: conserva el ancho y bloquea clics repetidos */
function conCarga(btn, texto, ms, fn) {
  if (btn.classList.contains('cargando')) return;
  const ancho = btn.offsetWidth, previo = btn.innerHTML;
  btn.style.minWidth = ancho + 'px';
  btn.classList.add('cargando'); btn.disabled = true; btn.setAttribute('aria-busy', 'true');
  btn.innerHTML = `<span class="giro" aria-hidden="true"></span><span>${texto}</span>`;
  setTimeout(() => {
    if (btn.isConnected) {
      btn.classList.remove('cargando'); btn.disabled = false; btn.removeAttribute('aria-busy');
      btn.innerHTML = previo; btn.style.minWidth = '';
    }
    fn && fn();
  }, ms);
}

/* Errores de formulario */
function limpiarErrores(ambito) {
  $$('.error-campo', ambito).forEach(p => { p.hidden = true; p.textContent = ''; });
  $$('[aria-invalid="true"]', ambito).forEach(i => i.removeAttribute('aria-invalid'));
}
function mostrarErrores(ambito, errores) {
  limpiarErrores(ambito);
  let primero = null;
  for (const [id, msg] of Object.entries(errores)) {
    const el = document.getElementById(id);
    const p = document.getElementById(id + '-err');
    if (el) { el.setAttribute('aria-invalid', 'true'); primero = primero || el; }
    if (p) { p.textContent = msg; p.hidden = false; }
  }
  if (primero) { primero.focus({ preventScroll: true }); primero.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches || db.ui.reducir ? 'auto' : 'smooth' }); }
  return !primero;
}
const err = id => `<p class="error-campo" id="${id}-err" hidden></p>`;
const desc = id => `aria-describedby="${id}-err"`;

/* =========================================================
   Navegación
   ========================================================= */
let guardia = null, ignorarHash = false, hashPrevio = location.hash;

function ruta() {
  const h = location.hash.replace(/^#/, '');
  let m;
  if (!db.sesion) return { nombre: 'acceso' };
  if (h === '' || h === 'acceso' || h === 'articulos') return { nombre: 'articulos' };
  if ((m = h.match(/^ficha-(\d+)$/))) return { nombre: 'ficha', id: +m[1] };
  if ((m = h.match(/^editar-(\d+)$/))) return { nombre: 'editar', id: +m[1] };
  if (h === 'compra') return { nombre: 'compra' };
  if ((m = h.match(/^compra-registrada-(\d+)$/))) return { nombre: 'registrada', id: +m[1] };
  if (h === 'interaccion') return { nombre: 'interaccion' };
  if (h === 'pantallas') return { nombre: 'pantallas' };
  return { nombre: 'noEncontrado' };
}
function ir(h) { if (location.hash === '#' + h) render(); else location.hash = h; }

window.addEventListener('hashchange', () => {
  if (ignorarHash) { ignorarHash = false; hashPrevio = location.hash; return; }
  if (guardia && guardia()) {
    const destino = location.hash;
    ignorarHash = true; location.hash = hashPrevio;
    confirmar({
      titulo: 'Descartar cambios', mensaje: 'Hay cambios sin guardar en este artículo. Si salís, se pierden.',
      textoOk: 'Descartar y salir', peligro: true,
      onOk: () => { guardia = null; location.hash = destino; }
    });
    return;
  }
  hashPrevio = location.hash;
  render();
});

function shell(r, html) {
  const actA = ['articulos', 'ficha', 'editar'].includes(r.nombre), actC = ['compra', 'registrada'].includes(r.nombre);
  return `<header class="barra"><div class="contenedor">
      <a class="marca" href="#articulos" aria-label="La Central Repuestos, ir a Artículos">${LOGO}</a>
      <nav class="nav" aria-label="Principal">
        <a href="#articulos" ${actA ? 'aria-current="page"' : ''}>${I('caja')}Artículos</a>
        <a href="#compra" ${actC ? 'aria-current="page"' : ''}>${I('factura')}Factura de compra</a>
      </nav>
      <div class="usuario"><div class="usuario-datos"><strong>${esc(db.sesion.nombre)}</strong><span>${ROL_TXT[db.sesion.rol]}</span></div>
        <button type="button" class="btn btn-oscuro btn-chico" data-accion="salir">${I('salir')}<span>Salir</span></button></div>
    </div></header>
    <main class="contenedor"><div class="vista">${html}</div></main>
    <footer class="contenedor"><div class="pie"><span>La Central Repuestos · <a class="enlace enlace-gris" href="#pantallas">Propuesta visual</a></span>
      <span>Datos ficticios para revisión · <button type="button" class="enlace enlace-gris" data-accion="restablecer">Restablecer datos</button></span></div></footer>`;
}

function render() {
  const r = ruta();
  guardia = null;
  document.documentElement.classList.toggle('reducir-mov', !!db.ui.reducir);
  const app = $('#app');
  if (r.nombre === 'acceso') {
    app.innerHTML = vistaAcceso();
    document.title = 'Ingresar · La Central';
    montarAcceso();
    return;
  }
  const v = VISTAS[r.nombre](r);
  app.innerHTML = shell(r, v.html);
  document.title = (v.titulo || 'La Central') + ' · La Central Repuestos';
  window.scrollTo(0, 0);
  v.montar && v.montar();
  if (!v.focoPropio) { const h1 = $('h1', app); h1 && h1.focus({ preventScroll: true }); }
}
/* Re-render en la misma vista conservando foco y posición */
function refrescar(enfocar) {
  const idFoco = document.activeElement && document.activeElement.id;
  const y = window.scrollY;
  const r = ruta();
  const v = VISTAS[r.nombre](r);
  $('main .vista').innerHTML = v.html;
  $('main .vista').style.animation = 'none';
  v.montar && v.montar();
  window.scrollTo(0, y);
  const el = enfocar ? $(enfocar) : (idFoco && document.getElementById(idFoco));
  el && el.focus({ preventScroll: true });
}

function montarAcceso() {
  const f = $('#form-acceso');

      ir(destino && destino !== 'acceso' ? destino : 'articulos');

  });
}

/* =========================================================
   Vista: artículos (búsqueda)
   ========================================================= */
function buscarArticulos(q, inactivos) {
  const alts = q.split('*').map(a => norm(a).trim().split(/\s+/).filter(Boolean)).filter(a => a.length);
  return db.articulos.filter(a => {
    if (!inactivos && !a.activo) return false;
    if (!alts.length) return true;
    const pajar = norm(`${a.nombre} ${a.codigo} ${a.codigos.map(c => c.codigo).join(' ')}`);
    return alts.some(toks => toks.every(t => pajar.includes(t)));
  });
}
function ordenar(lista) {
  const { campo, dir } = db.ui.orden;
  const s = dir === 'asc' ? 1 : -1;
  return lista.slice().sort((a, b) => s * String(a[campo]).localeCompare(String(b[campo]), 'es', { numeric: true, sensitivity: 'base' }));
}
function thOrden(campo, txt) {
  const o = db.ui.orden, act = o.campo === campo;
  const aria = act ? (o.dir === 'asc' ? 'ascending' : 'descending') : 'none';
  return `<th aria-sort="${aria}"><button type="button" class="th-orden" id="ord-${campo}" data-accion="ordenar" data-campo="${campo}" ${act ? 'data-activo' : ''}>${txt}${I(act ? (o.dir === 'asc' ? 'ordenAsc' : 'ordenDesc') : 'orden')}<span class="sr">, ordenar</span></button></th>`;
}
function vistaArticulos() {
  const { q, inactivos } = db.ui;
  const lista = ordenar(buscarArticulos(q, inactivos));
  const total = lista.length, paginas = Math.max(1, Math.ceil(total / POR_PAGINA));
  const p = Math.min(Math.max(1, db.ui.pagina), paginas);
  const desde = (p - 1) * POR_PAGINA, items = lista.slice(desde, desde + POR_PAGINA);

  let resultados;
  if (!total) {
    resultados = `<div class="vacio">${I('buscar')}
      <h2>${q.trim() ? `Sin resultados para «${esc(q.trim())}»` : 'No hay artículos para mostrar'}</h2>
      <p>Revisá el código o probá con otra palabra.<br>${inactivos ? 'La búsqueda ya incluye artículos inactivos.' : 'Si el artículo está dado de baja, activá «Incluir inactivos».'}</p>
      <button type="button" class="btn btn-secundario" id="btn-volver-buscar" data-accion="volver-buscar">${I('flechaIzq')}<span>Volver a buscar</span></button></div>`;
  } else {
    resultados = `<div class="tarjeta-cab" style="border-top:1px solid var(--linea)"><h2 style="font-size:15.5px">${q.trim() ? 'Resultados de la búsqueda' : 'Todos los artículos'}</h2>
        <span class="meta">${total} ${total === 1 ? 'artículo encontrado' : 'artículos encontrados'}</span></div>
      <div class="tabla-caja"><table class="tabla tabla-art">
        <thead><tr>${thOrden('codigo', 'Código interno')}${thOrden('nombre', 'Nombre')}<th>Códigos de proveedor</th><th><span class="sr">Acciones</span></th></tr></thead>
        <tbody>${items.map(a => `<tr data-fila="${a.id}" class="${a.activo ? '' : 'fila-inactiva'}">
          <td class="mono" style="width:18%">${a.codigo}</td>
          <td>${esc(a.nombre)}${a.activo ? '' : ' <span class="estado estado-inactivo">Inactivo</span>'}</td>
          <td style="width:28%">${a.codigos.length ? `<span class="chip-cod">${a.codigos.map(c => esc(c.codigo)).join(' · ')}</span>` : '<span class="tenue">—</span>'}</td>
          <td class="der" style="width:12%"><a class="enlace" href="#ficha-${a.id}">Ver ficha <span aria-hidden="true">→</span><span class="sr"> de ${esc(a.nombre)}</span></a></td></tr>`).join('')}
        </tbody></table></div>
      <div class="tarjeta-pie"><span style="font-size:13px;color:var(--texto-2)">Mostrando ${desde + 1}–${desde + items.length} de ${total} artículos</span>
        <div class="paginacion"><button type="button" class="btn btn-secundario btn-chico" id="pag-ant" data-accion="pagina" data-p="${p - 1}" ${p <= 1 ? 'disabled' : ''}>Anterior</button>
        <span class="num">${p} de ${paginas}</span>
        <button type="button" class="btn btn-secundario btn-chico" id="pag-sig" data-accion="pagina" data-p="${p + 1}" ${p >= paginas ? 'disabled' : ''}>${I('chevDer')}<span>Siguiente</span></button></div></div>`;
  }

  return {
    titulo: 'Artículos',
    html: `<div class="migas">${I('caja')}<span>Artículos</span></div>
      <div class="cabecera"><div><h1 tabindex="-1">Artículos</h1><p class="bajada">Buscá repuestos por nombre o código y consultá su ficha.</p></div></div>
      <section class="tarjeta">
        <form class="busqueda" id="form-busqueda" role="search" novalidate>
          <label for="q">Buscar artículos</label>
          <div class="con-icono">${I('buscar')}<input class="entrada" id="q" type="search" value="${esc(q)}" placeholder="Nombre, código interno o código de proveedor" autocomplete="off"></div>
          <label class="casilla"><input type="checkbox" id="inactivos" ${inactivos ? 'checked' : ''}> Incluir inactivos</label>
          <button type="submit" class="btn btn-primario" id="btn-buscar">${I('buscar')}<span>Buscar</span></button>
          <button type="button" class="btn btn-secundario" id="btn-nuevo" data-accion="nuevo-articulo">${I('mas')}<span>Nuevo artículo</span></button>
          <p class="ayuda">Usá * para buscar alternativas: filtro * correa</p>
        </form>
        ${resultados}
      </section>`,
    montar() {
      $('#form-busqueda').addEventListener('submit', e => {
        e.preventDefault();
        db.ui.q = $('#q').value; db.ui.pagina = 1; guardar(); refrescar('#q');
      });
      $('#inactivos').addEventListener('change', e => { db.ui.inactivos = e.target.checked; db.ui.pagina = 1; guardar(); refrescar('#inactivos'); });
    }
  };
}

/* =========================================================
   Filas de códigos de proveedor (alta y edición)
   ========================================================= */
const filas = {};
function filaCodigoHTML(pref, i, f) {
  const idP = `${pref}-prov-${i}`, idC = `${pref}-cod-${i}`;
  return `<div class="fila-cod" data-fila-cod="${i}">
    <div class="campo"><label for="${idP}">ID de proveedor</label><input class="entrada" id="${idP}" data-cp="prov" data-i="${i}" inputmode="numeric" value="${esc(f.prov)}" autocomplete="off" ${desc(idP)}>
      ${err(idP)}<p class="ayuda" id="${idP}-ayuda">${ayudaProv(f.prov)}</p></div>
    <div class="campo"><label for="${idC}">Código del proveedor</label><input class="entrada" id="${idC}" data-cp="cod" data-i="${i}" value="${esc(f.cod)}" autocomplete="off" spellcheck="false" maxlength="30" ${desc(idC)}>${err(idC)}</div>
    <button type="button" class="enlace quitar" style="margin-top:29px" data-accion="quitar-fila" data-pref="${pref}" data-i="${i}">Quitar<span class="sr"> fila ${i + 1}</span></button>
  </div>`;
}
function ayudaProv(v) {
  v = String(v || '').trim();
  if (!v) return 'Identificador del proveedor';
  if (!/^\d+$/.test(v)) return 'El ID es un número';
  const p = prov(+v);
  if (!p) return 'No existe un proveedor con ese ID';
  return `${esc(p.razon)}${p.activo ? '' : ' · inactivo'}`;
}
function filasHTML(pref) {
  const lista = filas[pref];
  return lista.length ? lista.map((f, i) => filaCodigoHTML(pref, i, f)).join('') : `<p class="ayuda" style="font-size:12.5px">No hay códigos nuevos para agregar.</p>`;
}
function leerFilas(pref, raiz = document) {
  filas[pref] = $$(`[data-fila-cod]`, $(`#${pref}-filas`, raiz)).map(div => ({ prov: $('[data-cp="prov"]', div).value, cod: $('[data-cp="cod"]', div).value }));
  return filas[pref];
}
function redibujarFilas(pref, raiz = document, enfocar) {
  $(`#${pref}-filas`, raiz).innerHTML = filasHTML(pref);
  if (enfocar) { const el = $(enfocar, raiz); el && el.focus(); }
}
function validarFilas(pref, articulo, raiz = document) {
  const lista = leerFilas(pref, raiz), errores = {}, nuevos = [], vistos = new Set(), codVistos = new Set();
  lista.forEach((f, i) => {
    const pid = f.prov.trim(), cod = f.cod.trim().toUpperCase();
    if (!pid && !cod) return;
    const idP = `${pref}-prov-${i}`, idC = `${pref}-cod-${i}`;
    if (!pid) errores[idP] = 'Ingresá el ID del proveedor.';
    else if (!/^\d+$/.test(pid)) errores[idP] = 'El ID de proveedor es un número.';
    else {
      const p = prov(+pid);
      const vig = articulo && articulo.codigos.find(c => c.proveedorId === +pid);
      if (!p) errores[idP] = 'No existe un proveedor con ese ID.';
      else if (!p.activo) errores[idP] = 'El proveedor está inactivo.';
      else if (vig) errores[idP] = `El artículo ya tiene un código vigente de este proveedor (${vig.codigo}). Retiralo desde la ficha para reemplazarlo.`;
      else if (vistos.has(+pid)) errores[idP] = 'Va un solo código por proveedor.';
      vistos.add(+pid);
    }
    if (!cod) errores[idC] = 'Ingresá el código.';
    else if (!/^[A-Z0-9][A-Z0-9.\-/]{0,29}$/.test(cod)) errores[idC] = 'Usá letras, números, guion, punto o barra.';
    else {
      const duenio = db.articulos.find(a => a.codigos.some(c => c.codigo === cod));
      if (duenio && (!articulo || duenio.id !== articulo.id)) errores[idC] = `Ese código ya está asignado a ${duenio.codigo}.`;
      else if (duenio) errores[idC] = 'Ese código ya está vinculado a este artículo.';
      else if (codVistos.has(cod)) errores[idC] = 'Código repetido en el formulario.';
      codVistos.add(cod);
    }
    nuevos.push({ proveedorId: +pid, codigo: cod });
  });
  return { errores, nuevos };
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.getAttribute && t.getAttribute('aria-invalid') === 'true') { t.removeAttribute('aria-invalid'); const p = document.getElementById(t.id + '-err'); if (p) { p.hidden = true; p.textContent = ''; } }
  if (t.matches('[data-cp="prov"]')) { const a = document.getElementById(t.id + '-ayuda'); if (a) a.innerHTML = ayudaProv(t.value); }
});

function validarDatos(pref, nombre, ubic) {
  const errores = {};
  if (!nombre) errores[`${pref}-nombre`] = 'El nombre es obligatorio.';
  else if (nombre.length < 3) errores[`${pref}-nombre`] = 'Escribí un nombre de al menos 3 caracteres.';
  else if (nombre.length > 120) errores[`${pref}-nombre`] = 'El nombre admite hasta 120 caracteres.';
  if (ubic.length > 60) errores[`${pref}-ubic`] = 'La ubicación admite hasta 60 caracteres.';
  return errores;
}

function registrarFactura(btn) {
  const b = borrador(), errores = {};
  const numero = b.numero.trim().toUpperCase();
  if (!numero) errores['f-numero'] = 'Ingresá el número del comprobante.';
  else if (!/^[A-CM]-\d{4}-\d{8}$/.test(numero)) errores['f-numero'] = 'Usá el formato A-0003-00018427.';
  else if (db.facturas.some(f => f.proveedorId === b.proveedorId && f.numero === numero)) errores['f-numero'] = 'Esa factura ya está registrada para este proveedor.';
  if (!b.emision) errores['f-emision'] = 'Indicá la fecha de emisión.';
  else if (b.emision > hoyISO()) errores['f-emision'] = 'La emisión no puede ser posterior a hoy.';
  if (b.vencimiento && b.emision && b.vencimiento < b.emision) errores['f-venc'] = 'El vencimiento no puede ser anterior a la emisión.';
  const perc = {};
  for (const k of ['iva', 'iibb', 'municipal', 'ganancias']) {
    const n = parseAR(b.perc[k]);
    if (!isFinite(n) || n < 0) errores['f-perc-' + k] = 'Ingresá un importe válido, por ejemplo 1.200,00.';
    else perc[k] = redondear(n);
  }
  const lineas = [];
  b.lineas.forEach(l => {
    const u = l.uid, cant = String(l.cantidad).trim(), precio = parseAR(l.precio), d = parseAR(l.desc);
    if (!l.sucursalId) errores[`l${u}-suc`] = 'Elegí el destino.';
    if (!/^\d+$/.test(cant) || +cant < 1) errores[`l${u}-cant`] = 'Cantidad entera mayor a 0.';
    else if (+cant > 99999) errores[`l${u}-cant`] = 'Revisá la cantidad.';
    if (!String(l.precio).trim()) errores[`l${u}-prec`] = 'Ingresá el precio.';
    else if (!isFinite(precio) || precio <= 0) errores[`l${u}-prec`] = 'Precio mayor a 0.';
    if (!isFinite(d) || d < 0 || d >= 100) errores[`l${u}-desc`] = 'Entre 0 y 99,99.';
    lineas.push({ articuloId: l.articuloId, sucursalId: +l.sucursalId, cantidad: +cant, precio, desc: d });
  });
  if (!b.proveedorId || !lineas.length) return;
  if (!mostrarErrores($('#vista-compra'), errores)) { aviso('Revisá los campos marcados.', { tipo: 'error' }); return; }
  conCarga(btn, 'Registrando…', 850, () => {
    const resultado = [];
    lineas.forEach(l => {
      const a = art(l.articuloId); if (!a) return;
      a.stock[l.sucursalId] = (a.stock[l.sucursalId] || 0) + l.cantidad;
      a.costo = redondear(l.precio * (1 - l.desc / 100));
    });
    lineas.forEach(l => { const a = art(l.articuloId); if (a) resultado.push({ articuloId: a.id, codigo: a.codigo, nombre: a.nombre, costo: a.costo, sucursalId: l.sucursalId, stockDestino: a.stock[l.sucursalId], cantidad: l.cantidad }); });
    const id = (db.facturas.reduce((m, f) => Math.max(m, f.id), 0)) + 1;
    db.facturas.push({ id, numero, proveedorId: b.proveedorId, emision: b.emision, vencimiento: b.vencimiento || null, percepciones: perc, lineas, resultado, registrada: new Date().toISOString(), usuario: db.sesion.usuario });
    db.borrador = null; guardar();
    aviso(`Factura ${numero} registrada.`);
    ir(`compra-registrada-${id}`);
  });
}

function salir() {
  const hacer = () => { guardia = null; db.sesion = null; guardar(); aviso('Cerraste la sesión.'); if (location.hash === '#acceso') render(); else location.hash = 'acceso'; };
  if (guardia && guardia()) confirmar({ titulo: 'Descartar cambios', mensaje: 'Hay cambios sin guardar. Si cerrás la sesión, se pierden.', textoOk: 'Descartar y salir', peligro: true, onOk: hacer });
  else hacer();
}
const ACCIONES = {
  'salir': () => salir(),
  'restablecer': () => confirmar({
    titulo: 'Restablecer datos de demostración', mensaje: 'Se pierden los artículos, cambios y facturas que cargaste. Tu sesión sigue abierta.',
    textoOk: 'Restablecer', peligro: true, icono: 'reactivar', ms: 500,
    onOk: () => { const s = db.sesion, red = db.ui.reducir; db = semilla(); db.sesion = s; db.ui.reducir = red; guardar(); aviso('Datos de demostración restablecidos.'); guardia = null; ir('articulos'); }
  }),
  'ordenar': el => {
    const c = el.dataset.campo, o = db.ui.orden;
    db.ui.orden = { campo: c, dir: o.campo === c && o.dir === 'asc' ? 'desc' : 'asc' };
    db.ui.pagina = 1; guardar(); refrescar();
  },
  'pagina': el => {
    db.ui.pagina = +el.dataset.p; guardar(); refrescar();
    const btn = document.getElementById(el.id);
    if (!btn || btn.disabled) { const otro = $(el.id === 'pag-sig' ? '#pag-ant' : '#pag-sig'); otro && otro.focus({ preventScroll: true }); }
    const t = $('.tabla-art'); t && t.scrollIntoView({ block: 'start' });
  },
  'volver-buscar': () => { db.ui.q = ''; db.ui.pagina = 1; guardar(); refrescar('#q'); },
  'nuevo-articulo': () => modalNuevo(),
  'baja': () => { const a = art(ruta().id); a && modalBaja(a); },
  'retirar-codigo': el => { const a = art(ruta().id); a && modalRetirar(a, el.dataset.cod); },
  'reactivar': el => {
    const a = art(ruta().id); if (!a) return;
    conCarga(el, 'Reactivando…', 600, () => { a.activo = true; a.fechaReactivacion = hoyISO(); guardar(); aviso(`${a.codigo} está activo otra vez.`); refrescar('h1'); });
  },
  'agregar-fila': el => {
    const pref = el.dataset.pref, raiz = el.closest('.modal-raiz') || document;
    leerFilas(pref, raiz);
    if (filas[pref].length >= 8) { aviso('Podés agregar hasta 8 códigos por vez.', { tipo: 'error' }); return; }
    filas[pref].push({ prov: '', cod: '' });
    redibujarFilas(pref, raiz, `#${pref}-prov-${filas[pref].length - 1}`);
  },
  'quitar-fila': el => {
    const pref = el.dataset.pref, raiz = el.closest('.modal-raiz') || document;
    leerFilas(pref, raiz);
    filas[pref].splice(+el.dataset.i, 1);
    redibujarFilas(pref, raiz);
    const btn = $(`[data-accion="agregar-fila"][data-pref="${pref}"]`, raiz); btn && btn.focus();
  },
  'elegir-prov': el => { const b = borrador(); b.proveedorId = +el.dataset.id; b.resProv = null; guardar(); refrescar('#btn-cambiar-prov'); aviso(`Proveedor seleccionado: ${prov(b.proveedorId).razon}.`); },
  'cambiar-prov': () => { const b = borrador(); b.proveedorId = null; guardar(); refrescar('#q-prov'); },
  'agregar-linea': el => {
    const b = borrador(), a = art(+el.dataset.id); if (!a) return;
    const uid = b.sig++;
    b.lineas.push({ uid, articuloId: a.id, sucursalId: '', cantidad: '1', precio: a.costo != null ? num2(a.costo) : '', desc: '0' });
    guardar(); refrescar(`#l${uid}-suc`);
    aviso(`${a.codigo} agregado. Elegí el destino de la línea.`);
  },
  'quitar-linea': el => {
    const b = borrador(), i = b.lineas.findIndex(l => String(l.uid) === el.dataset.uid); if (i < 0) return;
    const [l] = b.lineas.splice(i, 1); const a = art(l.articuloId);
    guardar(); refrescar('#q-art');
    aviso(`Línea ${a ? a.codigo : ''} quitada.`, { accion: 'Deshacer', alAccion: () => { b.lineas.splice(i, 0, l); guardar(); if (ruta().nombre === 'compra') refrescar(`#l${l.uid}-suc`); }, ms: 6000 });
  },
  'descartar-borrador': () => confirmar({
    titulo: 'Descartar el borrador', mensaje: 'Se borran el proveedor, los datos del comprobante y las líneas cargadas.', textoOk: 'Descartar', peligro: true, icono: 'tacho',
    onOk: () => { db.borrador = null; guardar(); aviso('Borrador descartado.'); refrescar('h1'); }
  }),
  'registrar': el => registrarFactura(el),
  'otra-factura': () => { db.borrador = null; guardar(); ir('compra'); },
  'demo-guardar': el => {
    const msg = $('#demo-msg');
    msg.textContent = '';
    conCarga(el, 'Guardando…', 1100, () => {
      el.innerHTML = '<span>Cambios guardados</span>'; msg.textContent = 'Los cambios de muestra se guardaron correctamente.';
      setTimeout(() => { if (el.isConnected && !el.classList.contains('cargando')) el.innerHTML = '<span>Guardar cambios</span>'; }, 2600);
    });
  },
  'demo-cancelar': () => { $('#demo-msg').textContent = 'Operación cancelada. No se guardó nada.'; const b = $('#demo-guardar'); if (!b.classList.contains('cargando')) b.innerHTML = '<span>Guardar cambios</span>'; },
  'demo-baja': () => confirmar({ titulo: 'Dar de baja (muestra)', mensaje: 'Esta confirmación es de prueba: no modifica ningún artículo.', textoOk: 'Dar de baja', peligro: true, icono: 'tacho', ms: 600, onOk: () => { $('#demo-msg').textContent = 'Baja de muestra confirmada.'; } }),
  'ir-pantalla': el => irPantalla(el.dataset.p)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-accion]');
  if (el && !el.disabled && ACCIONES[el.dataset.accion]) { e.preventDefault(); ACCIONES[el.dataset.accion](el); return; }
  const fila = e.target.closest('tr[data-fila]');
  if (fila && !e.target.closest('a,button,input')) ir('ficha-' + fila.dataset.fila);
});

/* =========================================================
   Arranque
   ========================================================= */
cargar();
fondoHex();
if (!db.sesion && location.hash && !/^#(acceso)?$/.test(location.hash)) db.ui.destino = location.hash.slice(1);
document.documentElement.classList.toggle('reducir-mov', !!db.ui.reducir);
render();
})();
</script>

</body>
</html>
